server:
  port: 8080
spring:
  application:
    name: ygflow-sample-service

# YGFlow 运行时配置
yglue:
  runtime:
    flow:
      # 是否启用 Flow 运行时
      enabled: true
      # 是否每次执行时重新加载流程规则
      # true: 每次执行都从文件重新加载规则（适合开发环境，规则修改后立即生效）
      # false: 使用缓存，首次加载后缓存规则（适合生产环境，性能更好）
      # 默认：false
      reload-on-execution: false
